<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My first website</title>
  <link rel="stylesheet" href="css/style.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>


<body>
<div class="container">

  <div class="left-side">
       <img src="img/picsea.jpg" alt="Background Image">
  </div>

   <div class="right-side">
        <div class="login-box">

             <img  class="logo" src="img/logo.png" alt="UI Unicorn Logo" >
            <span class="logo-text">UI Unicorn</span>
             <h1>Nice to see you again</h1>
           <form>

        <h6>Login</h6>
        <div class="input-login">
        <input type="text" placeholder="Email or phone number" required>
        </div>
        <h6>Password</h6>
        <div class="input-login">
        <input type="password" placeholder="Enter password" required>
        <i class='bx bx-low-vision'></i>
        </div>
        <div class="options">

          <label for="check">
           <input type="checkbox" >
           Remembe_me</label>
          <a href="#" >Forgot password?</a>
        </div>

        <button type="submit" class="btn">Sign in</button>
      </form>

      <div class="line"></div>
      <button class="google-btn">

        <img src="img/google.jpeg" alt="Google Logo" class="google-logo">
        Or sign in with Google
      </button>

      <p>Don't have an account? <a href="#">Sign up now</a></p>

<div class="Unicorn">
  <img src="img/logo.png" alt="UI Unicorn" class="logoUI">
  <div class="world">UI Unicorn</div>

</div>
<div class="footer">
    <div class="footer-left">
      <img src="img/figma.png" alt="Figma Logo" class="footer-logo">
      <span>@uiunicorn</span>
    </div>
    <div >
      <span>© Perfect Login 2025</span>
    </div>
    </div>

</div>
</div>

</div>

</body>
</html>
